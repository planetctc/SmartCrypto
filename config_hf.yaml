# ============================================================
# Bitget USDT 永续合约自动交易机器人 配置文件（高频模式：5 分钟突破，超短线快进快出，多币多单）
# 所有金额单位都是 USDT（约等于美金）
# API key 不要写在这里！放在环境变量里（见 README）
# ============================================================

# 运行模式:
#   paper = 本地模拟（用真实行情，不下单，不需要 API key）
#   demo  = Bitget 模拟盘（假钱，需要模拟盘 API key）
#   live  = 真钱实盘（还需要设置环境变量 I_UNDERSTAND_REAL_MONEY=yes 才会启动）
mode: demo

# Bitget 账户类型（钱放在哪个账户）:
#   auto    = 自动判断
#   classic = 「合约」账户
#   unified = 「统一账户」
account_type: auto

symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - SOL/USDT:USDT
  - XRP/USDT:USDT
  - DOGE/USDT:USDT

timeframe: 5m          # 进场看的 K 线周期
trend_timeframe: 1h    # 判断大方向的 K 线周期

# ---------------- 仓位和杠杆 ----------------
capital_usd: 100       # 机器人当作账户只有 100 USDT 来算风控（模拟盘假钱很多时用）；0 = 用账户真实余额
leverage: 100          # 杠杆倍数（逐仓）
margin_mode: cross      # 全仓：整个账户一起扛，爆仓价离得远，止损可以放宽（isolated = 逐仓）
min_margin_usd: 5      # 每单最少保证金（信号一般时）
max_margin_usd: 15     # 每单最多保证金（信号强时）
max_open_positions: 8  # 每个币最多一单，不同币可以同时开（不错过信号）
replace_on_new_signal: false  # 不同币可以同时开，不用平掉换单

# 进场方式:
#   market = 市价单，马上成交，手续费 0.06%
#   maker  = 挂单（只做 maker），手续费 0.02%，但价格跑掉就不成交
entry_order: market   # 市价进场：信号出来马上成交，不错过
maker_timeout_seconds: 300   # 改成挂单进场时，挂 5 分钟没成交就撤单
tp_order: maker    # 止盈方式：maker = 开仓后挂只减仓的限价单止盈（手续费低）；market = 交易所止盈单（触发后市价）

# ---------------- 风控（减少亏损的关键） ----------------
risk:
  daily_max_loss_pct: 0.30     # 一天亏到当天开始资金的 30% 就全部平仓，停到第二天
  day_reset_utc_offset: 8      # "一天"按 UTC+8（北京/新加坡/马来西亚时间）00:00 重置
  max_loss_per_trade_usd: 10   # 单笔止损+手续费最多亏多少，超过就自动缩小仓位
  min_equity_stop_usd: 50      # 账户总资金低于这个数，机器人完全停止（设 0 关闭）
  max_stop_pct: 0.0100         # 止损距离最大 1%（ETH 2400 时约 24 点）
  min_stop_pct: 0.0030         # 止损距离最小 0.3%（ETH 约 7 点，BTC 约 250 美金，太近会被正常波动打掉）
  liq_buffer_pct: 0.0008       # 止损价至少要比爆仓价早 0.08%
  maintenance_margin_rate: 0.005  # 维持保证金率（估算爆仓价用，偏保守）
  max_consecutive_losses: 0    # 连续亏几单就暂停（0 = 不暂停，靠一天亏 30% 停止来保护）
  pause_after_losses_minutes: 120  # 暂停 2 小时
  cooldown_bars_after_stop: 0  # 某个币止损后马上可以再开（0 = 不等，不错过机会）
  max_trades_per_day: 40       # 每天最多开几单（防止手续费失控）

# ---------------- 策略参数 ----------------
strategy:
  signal_type: breakout     # 信号类型：breakout 突破 / pullback 顺势回踩 / reversion 超买超卖反转 / score 综合打分（用「回测比较」挑）
  min_score: 5              # 综合打分：趋势、均线、MACD、KDJ、RSI、布林带、放量、K线形态、突破 9 项，净 5 项同向才开单
  fast_ema: 20              # 顺势回踩：回踩到这条快线再收回去才进场
  bb_period: 20             # 超买超卖反转：布林带周期
  bb_std: 2.5               #   价格超出布林带几倍标准差才算太远
  rsi_period: 14
  rsi_low: 25               #   RSI 低于 25 算超卖（高于 75 算超买）
  trend_ema: 50            # 1 小时 EMA50 判断大方向
  breakout_lookback: 12    # 突破最近 12 根 K 线（1 小时）的高点/低点就进场
  volume_lookback: 20
  volume_factor: 1.0       # 突破那根 K 线成交量不低于平均就行
  trend_min_gap: 0         # 大方向要多明确才做：价格离 EMA 至少多少（0.003 = 0.3%），0 = 不限制
  atr_period: 14
  atr_stop_mult: 1.0       # 止损 = 1 倍 ATR（再受上面的最大/最小止损限制）
  breakeven_at_r: 1.0      # 赚到 1 倍止损距离后，把止损移到成本，之后开始跟踪
  trail_atr_mult: 1.5      # 之后用 1.5 倍 ATR 跟踪止损锁利润
  max_hold_bars: 24        # 没保本的单最多拿 24 根 K 线（5 分钟 × 24 = 2 小时）就平掉，已经保本的单不限时

  # 视频的做法（分批进场、补仓、分批止盈、避开整数关口）先放一边，现在是一次开满、一个止盈
  scale_in_frac: 1.0          # 第一批占计划仓位的比例（1 = 一次开满）
  scale_in_at_r: 0            # 补仓：反向走多少倍止损距离时补仓；0 = 不补仓
  take_profit_r: [1.0]        # 止盈 = 1 倍止损距离，赚一点就走（可以写多档，例如 [1.2, 2.0, 3.0]）
  take_profit_split: []       # 多档止盈时，前面几档各平多少（例如 [0.34, 0.33]）
  avoid_round_numbers: false  # true = 止损放整数关口外面、止盈放整数关口前面


# ---------------- 费用（回测和模拟用） ----------------
fees:
  taker: 0.0006          # 吃单手续费 0.06%
  maker: 0.0002          # 挂单手续费 0.02%
  slippage: 0.0002       # 估计滑点 0.02%

loop_seconds: 5          # 实时模式每 5 秒检查一次
state_file: data/state_hf.json
log_file: data/bot_hf.log
